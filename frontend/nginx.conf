# SPA + same-origin API: the browser talks to one origin, so no CORS is needed
upstream backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Backend: API, health, Django admin and its static files
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Hashed bundles never change: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/monitors/7, /status/acme…) all serve the app shell; never cache it
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
